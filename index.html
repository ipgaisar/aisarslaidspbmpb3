<script>

[0,"",`<div class="hero"><p class="tag">BMMB1074 · Tugasan 3</p><h1 class="big">Dua Zaman,<br>Dua Pendekatan</h1><p class="sub">Peranan dan Pemikiran R.O. Winstedt dan Awang Sariyan dalam Memartabatkan Bahasa Melayu</p><div class="grid" style="text-align:left"><div class="card" style="grid-column:1/-1"><b>Nama ahli</b><div style="columns:2 260px;margin-top:6px"><div>1. MUHAMMAD AISAR BIN AZMI</div><div>2. NOR AIMAN ARIF BIN NOR AZAM</div><div>3. ILHAM ZAHAZAN BIN ABDUL RAHMAN</div><div>4. MUHAMMAD SHAHRUL ZAQUAN BIN MOHD SAFADI</div></div></div><div class="card"><b>Kursus</b><br>BMMB1074 Sejarah Perkembangan Bahasa Melayu</div><div class="card"><b>Pensyarah</b><br>DR. IZANI BIN IBRAHIM</div></div></div>`],
[0,"Objektif Persembahan",`<ul><li>Memperincikan peranan seorang tokoh asing dan seorang tokoh tempatan</li><li>Menganalisis pemikiran dan falsafah kedua-dua tokoh</li><li>Membanding beza sumbangan, impak dan legasi secara kritis</li></ul><div class="note"><b>Persoalan utama:</b> Bagaimanakah dua tokoh dari zaman berbeza memartabatkan bahasa Melayu?</div>`],
[0,"R.O. Winstedt: Latar Belakang",`<div class="bio"><div class="pcol"><div class="np"><b>Sir Richard Olaf Winstedt</b><span class="yrs">1878 – 1966</span><small>Orientalis · pentadbir kolonial · sarjana Melayu</small></div><div class="chips"><b>Sumbangan awal</b><i>Malay Grammar (1913)</i><i>Pantun Melayu (1914)</i><i>An English-Malay Dictionary (1914 hingga 1917)</i><i>Colloquial Malay (1916)</i><i>Dictionary of Colloquial Malay (1920)</i></div></div><div class="tl"><div class="ev"><span class="y">1878</span><span class="t">Lahir di Oxford, England</span></div><div class="ev"><span class="y">1902</span><span class="t">Tiba di Tanah Melayu</span></div><div class="ev"><span class="y">1913</span><span class="t">Menerbitkan <i>Malay Grammar</i></span></div><div class="ev"><span class="y">1916</span><span class="t">Penolong Pengarah Pelajaran Melayu</span></div><div class="ev"><span class="y">1920</span><span class="t">Ijazah DLitt, Universiti Oxford; <i>Dictionary of Colloquial Malay</i></span></div><div class="ev"><span class="y">1924</span><span class="t">Pengarah Pelajaran</span></div><div class="ev"><span class="y">1928–1931</span><span class="t">Presiden pertama Kolej Raffles, Singapura</span></div><div class="ev"><span class="y">1937–1946</span><span class="t">Pembaca Bahasa Melayu, SOAS, Universiti London</span></div><div class="ev"><span class="y">1966</span><span class="t">Meninggal dunia di London</span></div></div></div>`],
[0,"Awang Sariyan: Latar Belakang",`<div class="bio ac"><div class="pcol"><div class="np"><b>Profesor Emeritus Datuk Seri Dr. Awang Sariyan</b><small>Tokoh bahasa dan persuratan Melayu · pakar linguistik</small></div><div class="chips"><b>Bidang sumbangan</b><i>Perancangan bahasa</i><i>Taraf bahasa Melayu</i><i>Mutu bahasa Melayu</i><i>Pendidikan bahasa</i></div></div><div class="tl"><div class="ev"><span class="y">2008–2011</span><span class="t">Penyandang Kursi Pengajian Melayu Kerajaan Malaysia di China</span></div><div class="ev"><span class="y">2012–2016</span><span class="t">Ketua Pengarah Dewan Bahasa dan Pustaka</span></div><div class="ev"><span class="y">2016–2018</span><span class="t">Penyandang Kursi Pengajian Melayu di China (kali kedua)</span></div><div class="ev"><span class="y">2017</span><span class="t">Menerbitkan <i>Pemikiran Awang Sariyan dalam Pemartabatan Bahasa Melayu</i> (DBP)</span></div><div class="ev"><span class="y">2019</span><span class="t">Penyandang Kursi Za’ba, Institut Peradaban Melayu, UPSI</span></div><div class="ev"><span class="y">2020</span><span class="t">Pengerusi Lembaga Pengelola DBP (dilantik Mei)</span></div><div class="ev"><span class="y">2026</span><span class="t">Ahli Dewan Negara, dilantik semula pada 11 Mei</span></div><div class="ev"><span class="y">Kini</span><span class="t">Profesor Emeritus; Pengerusi Majlis Bahasa Negara</span></div></div></div>`],
[1,"Pemikiran R.O. Winstedt",`<div class="grid"><div class="card"><h3>Pendekatan saintifik</h3>Mengkaji bahasa, sastera dan sejarah Melayu secara sistematik.<br><b>Bukti:</b> <i>A History of Malay Literature</i>; <i>A History of Malaya</i> (1935)</div><div class="card"><h3>Pendidikan vernakular</h3>Memperkukuh sekolah Melayu dan latihan guru.<br><b>Bukti:</b> Maktab Perguruan Sultan Idris (1922) dengan Biro Terjemahan untuk menyediakan bahan bacaan</div><div class="card"><h3>Pemeliharaan teks</h3>Menyunting dan menerbitkan teks Melayu klasik.<br><b>Bukti:</b> <i>Sejarah Melayu</i> (edisi 1938); teks <i>Tuhfat al-Nafis</i> (1932)</div><div class="card"><h3>Kerangka kolonial</h3>Bahasa Melayu dilihat sebagai bahasa pendidikan dan budaya.<br><b>Penilaian kami:</b> asas ilmu terbina, tetapi bahasa Melayu belum diangkat sebagai bahasa ilmu dan pentadbiran</div></div><div class="note"><b>Falsafah (analisis kumpulan):</b> ilmu dan pendidikan ialah asas untuk memelihara dan membina bahasa.</div>`],
[1,"Pemikiran Awang Sariyan",`<div class="grid"><div class="card"><h3>Kritis konstruktif</h3>Setiap kritikan disertakan cadangan penyelesaian</div><div class="card"><h3>Taraf dan mutu</h3><b>Taraf:</b> kedudukan bahasa dalam pentadbiran, pendidikan dan ilmu. <b>Mutu:</b> kecekapan dan ketepatan penggunaan bahasa</div><div class="card"><h3>Bahasa dan tamadun</h3>Bahasa tunjang peneguhan bangsa dan negara.<br><b>Bukti:</b> pada 8 Mei 2026 beliau menyeru agar Majlis Bahasa Melayu Antarabangsa dihidupkan semula supaya bahasa Melayu menjadi bahasa ilmu, diplomasi dan tamadun</div><div class="card"><h3>Bahasa dan nilai</h3>Linguistik dan pendidikan bahasa dikaitkan dengan agama dan akal budi</div><div class="card"><h3>Warisan ilmu</h3>Manuskrip Melayu lama sebagai asas perancangan masa depan.<br><b>Bukti:</b> Sariyan dan Jamian (2020) tentang manuskrip Melayu lama dan peradaban bangsa</div></div><div class="note"><b>Falsafah (analisis kumpulan):</b> bahasa ialah jati diri, ilmu dan tamadun bangsa.</div>`],
[2,"Perbandingan Sumbangan Spesifik",`<div class="tw"><table><tr><th>Bidang</th><th>Winstedt</th><th>Awang Sariyan</th></tr><tr><td>Linguistik</td><td><i>Malay Grammar</i> (1913), <i>Colloquial Malay</i> (1916), kamus Melayu-Inggeris dan Inggeris-Melayu</td><td>Pemikiran perancangan taraf dan mutu bahasa; <i>Pemikiran Awang Sariyan dalam Pemartabatan Bahasa Melayu</i> (2017)</td></tr><tr><td>Sastera dan teks</td><td><i>A History of Malay Literature</i>; sunting <i>Sejarah Melayu</i>, <i>Tuhfat al-Nafis</i></td><td>Kajian manuskrip Melayu lama dan persuratan (Sariyan dan Jamian, 2020)</td></tr><tr><td>Pendidikan</td><td>Maktab Perguruan Sultan Idris (1922), Biro Terjemahan</td><td>Kursi Za’ba, UPSI; Kursi Pengajian Melayu di China</td></tr><tr><td>Institusi</td><td>Pentadbir pendidikan, presiden pertama Kolej Raffles</td><td>Ketua Pengarah dan Pengerusi DBP; Pengerusi Majlis Bahasa Negara</td></tr></table></div>`],
[2,"Peranan dalam Pembinaan Bahasa",`<div class="grid"><div class="card"><h3>Winstedt</h3>Membina <b>asas ilmu</b>: tatabahasa, kamus, teks dan latihan guru</div><div class="card"><h3>Awang Sariyan</h3>Membina <b>pemerkasaan</b>: dasar, institusi dan wacana bahasa kebangsaan</div></div><div class="note"><b>Penghubung:</b> Maktab Perguruan Sultan Idris, yang diasaskan pada zaman Winstedt, kini menjadi UPSI, tempat Awang Sariyan memegang Kursi Za’ba</div><div class="note"><b>Rantaian peranan:</b> teks dan guru (Winstedt) → institusi bahasa kebangsaan (DBP) → pemerkasaan taraf dan mutu (Awang Sariyan)</div>`],
[2,"Impak Jangka Pendek",`<div class="grid"><div class="card"><h3>Winstedt (1900-an hingga 1940-an)</h3><ul><li>Bilangan guru, bahan bacaan dan terjemahan Melayu bertambah melalui maktab dan Biro Terjemahan</li><li>Teks klasik terpelihara dan diterbitkan</li><li><b>Kritikan:</b> pendidikan vernakular dalam kerangka kolonial</li></ul></div><div class="card"><h3>Awang Sariyan (2000-an hingga kini)</h3><ul><li>Wacana pemerkasaan bahasa kebangsaan dihidupkan</li><li>Peranan DBP dan Majlis Bahasa Negara dikukuhkan di bawah kepimpinan beliau</li><li><b>Cabaran:</b> cadangan penguatkuasaan seperti denda mendapat pelbagai reaksi</li></ul></div></div>`],
[2,"Impak Jangka Panjang",`<div class="grid"><div class="card"><h3>Winstedt</h3><ul><li>Rujukan awal kesarjanaan Melayu antarabangsa</li><li>Maktab yang diasaskan kini menjadi UPSI, institusi pendidikan guru</li><li><b>Kritikan:</b> pandangan Orientalis perlu dinilai semula oleh sarjana tempatan; bahasa Melayu belum diangkat sebagai bahasa ilmu</li></ul></div><div class="card"><h3>Awang Sariyan</h3><ul><li>Menguatkan hujah bahawa bahasa Melayu mampu menjadi bahasa ilmu dan bahasa kebangsaan</li><li>Menyeru kerjasama antarabangsa melalui Majlis Bahasa Melayu Antarabangsa</li><li><b>Cabaran:</b> globalisasi, teknologi dan bahasa media sosial</li></ul></div></div>`],
[3,"Persamaan",`<ul><li>Berperanan melalui <b>institusi</b>: Maktab Perguruan Sultan Idris dan Kolej Raffles; DBP dan Majlis Bahasa Negara</li><li>Menghasilkan <b>karya ilmiah</b> dan bahan rujukan: <i>Malay Grammar</i> dan kamus; <i>Pemikiran Awang Sariyan dalam Pemartabatan Bahasa Melayu</i></li><li>Menekankan <b>pendidikan</b> sebagai saluran pemartabatan: latihan guru dan Kursi Za’ba</li><li>Menghargai <b>warisan teks</b> dan persuratan Melayu: <i>Sejarah Melayu</i> dan manuskrip lama</li></ul>`],
[3,"Perbezaan",`<div class="tw"><table><tr><th>Aspek</th><th>Winstedt</th><th>Awang Sariyan</th></tr><tr><td>Latar</td><td>Orientalis British, era kolonial</td><td>Sarjana tempatan, era pascamerdeka</td></tr><tr><td>Taraf bahasa</td><td>Bahasa pendidikan vernakular</td><td>Bahasa kebangsaan dan bahasa ilmu</td></tr><tr><td>Matlamat</td><td>Pentadbiran dan kesarjanaan</td><td>Pemerkasaan taraf dan mutu</td></tr><tr><td>Perspektif</td><td>Pemerhati luar</td><td>Orang dalam, kritis-konstruktif</td></tr><tr><td>Gaya</td><td>Dokumentasi, pembinaan asas</td><td>Perancangan, dasar, pemerkasaan</td></tr><tr><td>Bahasa karya</td><td>Kebanyakan karya dalam bahasa Inggeris untuk khalayak Barat</td><td>Penulisan dan wacana dalam bahasa Melayu untuk khalayak tempatan</td></tr></table></div>`],
[3,"Masa Kini dan Masa Depan",`<div class="grid"><div class="card"><h3>Warisan Winstedt hari ini</h3>Kamus, teks klasik dan sejarah sastera masih menjadi rujukan awal, tetapi perlu dinilai semula secara kritis oleh sarjana tempatan.</div><div class="card"><h3>Pemikiran Awang Sariyan hari ini</h3>Taraf dan mutu bahasa relevan dengan bahasa media sosial dan teknologi. Seruan menghidupkan semula Majlis Bahasa Melayu Antarabangsa membawa bahasa Melayu ke peringkat dunia.</div></div><div class="note"><b>Cadangan kumpulan:</b><ul style="margin-top:8px"><li>Guru menekankan mutu bahasa yang betul dalam kelas dan dalam media digital</li><li>Teks dan manuskrip warisan dimanfaatkan sebagai bahan pembelajaran</li><li>Bahasa Melayu dikukuhkan sebagai bahasa ilmu melalui buku, kamus dan penyelidikan</li></ul></div>`],
[3,"Legasi dan Rumusan",`<div class="grid"><div class="card"><h3>Winstedt</h3>Asas dokumentasi bahasa; sumber sejarah untuk dikaji secara kritis. Legasinya kekal dalam teks, kamus dan institusi pendidikan guru.</div><div class="card"><h3>Awang Sariyan</h3>Pemikiran pemerkasaan yang relevan dengan cabaran semasa. Legasinya hidup dalam wacana taraf dan mutu bahasa, serta dasar dan institusi bahasa.</div></div><div class="note"><b>Rumusan:</b> Winstedt menyediakan asas, Awang Sariyan membawa pemerkasaan. Sebagai bakal guru bahasa Melayu, kita mewarisi kedua-dua tugas itu.</div><p class="q">Soalan renungan: Siapakah lebih berjasa, pembina asas atau pemerkasa taraf?</p>`],
[3,"Refleksi dan Seruan",`<div class="grid"><div class="card"><h3>Refleksi kumpulan</h3><ul><li>Kami belajar menilai tokoh secara kritis, bukan hanya mengagumi sumbangan mereka</li><li>Kami menyedari sumber yang pelbagai perlu dibandingkan untuk memastikan ketepatan maklumat</li><li>Kami memahami bahawa tugas memartabatkan bahasa berterusan, bukan selesai pada satu zaman</li></ul></div><div class="card"><h3>Seruan sebagai bakal guru</h3><ul><li>Gunakan bahasa Melayu yang baku dan bermutu</li><li>Hargai warisan teks dan persuratan</li><li>Jadi pemerkasa taraf bahasa di sekolah dan dalam masyarakat</li></ul></div></div><p class="q">Pembina asas dan pemerkasa taraf saling melengkapi. Giliran kitalah menyambung perjuangan itu.</p>`],
[3,"Rujukan",`<ul><li>Awang Sariyan. (2017). <i>Pemikiran Awang Sariyan dalam pemartabatan bahasa Melayu</i>. Dewan Bahasa dan Pustaka.</li><li>Barrett, E. C. G. (1967). Obituary: Sir Richard Winstedt. <i>Bulletin of the School of Oriental and African Studies, 30</i>(1), 272-275.</li><li>Bernama. (2026, May 8). <i>Revive MABM to strengthen Malay language globally -- Awang Sariyan</i>. https://bernama.com/en/news.php?id=2554349</li><li>Bernama. (2026, May 11). <i>13 ahli Dewan Negara termasuk enam lantikan baharu angkat sumpah senator hari ini</i>. https://www.bernama.com/radio/news.php?id=2555554</li><li>Britannica. (n.d.). <i>Sir Richard Olof Winstedt</i>. https://www.britannica.com/biography/Richard-Olof-Winstedt</li><li>Sariyan, A., &amp; Jamian, A. R. (2020). Sumbangan manuskrip Melayu lama kepada peradaban bangsa. <i>PENDETA: Journal of Malay Language, Education and Literature, 11</i>(2), 7-17.</li><li>Winstedt, R. O. (1913). <i>Malay grammar</i>. Clarendon Press.</li><li>Winstedt, R. O. (1920). <i>Dictionary of colloquial Malay: Malay-English and English-Malay</i>. Kelly &amp; Walsh.</li><li class="ph">[Tambah hantaran media sosial rasmi (contohnya DBP) yang kumpulan rujuk, jika ada]</li></ul><p class="q" style="text-align:center">Terima kasih. Sila ajukan soalan.</p>`]
];

function slot(k,label,cls){return '<label class="slot '+cls+'" tabindex="0"><input type="file" accept="image/*" hidden><img alt="'+label+'" '+(IMG[k]?'src="'+IMG[k]+'" class="on"':'')+'><span class="pl">'+label+'<br><small>Klik untuk pilih gambar</small></span></label>'}
try{document.querySelector("#s2 .pcol").insertAdjacentHTML("afterbegin",slot("w","Gambar R.O. Winstedt","wc pf"));
document.querySelector("#s3 .pcol").insertAdjacentHTML("afterbegin",slot("a","Gambar Awang Sariyan","ac pf"));
document.querySelector("#s6 .tw").insertAdjacentHTML("afterend",'<div class="bks">'+slot("b1","Kulit buku Malay Grammar (1913)","wc bk")+slot("b2","Kulit buku Pemikiran Awang Sariyan (2017)","ac bk")+'</div>')}catch(_){}
document.addEventListener("change",e=>{const i=e.target;if(!i.matches||!i.matches(".slot input")||!i.files[0])return;const r=new FileReader();r.onload=()=>{const im=i.parentNode.querySelector("img");im.src=r.result;im.classList.add("on")};r.readAsDataURL(i.files[0])});
document.addEventListener("keydown",e=>{const l=document.activeElement;if(l&&l.classList&&l.classList.contains("slot")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();l.querySelector("input").click()}});
document.addEventListener("click",e=>{const f=e.target.closest(".flipc");if(f){const o=f.classList.toggle("open");f.setAttribute("aria-pressed",o)}});
document.addEventListener("keydown",e=>{
 if(!ready){if(e.key==="Enter"||e.key===" ")openDoor();return}
 const f=document.activeElement;
 if((e.key==="Enter"||e.key===" ")&&f&&f.classList.contains("flipc")){e.preventDefault();f.click();return}
 if(e.key==="ArrowRight"||e.key==="PageDown")go(i+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(i-1)});
let tx=0;document.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(ready&&Math.abs(d)>70)go(i+(d<0?1:-1))},{passive:true});
function count(sl){sl.querySelectorAll(".n").forEach(el=>{const v=+el.dataset.v;if(off){el.textContent=v;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1200);el.textContent=Math.round(v-(1-p)*(1-p)*80);if(p<1)requestAnimationFrame(f);else el.textContent=v})(t0)})}
function mark(){
 const sec=S[i][0];
 [...$("nav").children].forEach((b,k)=>b.classList.toggle("on",k===sec));
 [...$("dots").children].forEach((b,k)=>b.classList.toggle("on",k===i));
 document.body.dataset.era=ERA[i]||"n";
 $("prev").disabled=i===0;$("next").disabled=i===S.length-1;
 $("cnt").textContent=(i+1)+" / "+S.length;
}
function show(n,dir){
 $("s"+i).classList.remove("on");i=n;
 const c=$("s"+n);c.style.setProperty("--dir",dir);c.scrollTop=0;c.classList.add("on");
 c.querySelectorAll(".flipc").forEach(f=>f.classList.remove("open"));
 mark();count(c);if(n)fit(c);
}
function go(n){
 n=Math.max(0,Math.min(S.length-1,n));if(n===i||!ready)return;
 const dir=n>i?1:-1,sec=S[n][0];
 if(sec!==S[i][0]&&!off){
  i0=i;const sw=$("sw");$("swt").innerHTML="<small>BAHAGIAN "+(sec+1)+"</small>"+SW[sec];
  sw.classList.remove("go");void sw.offsetWidth;sw.classList.add("go");
  i=n;mark();i=i0;setTimeout(()=>{i=i0;show(n,dir)},320);
 }else show(n,dir);
}
let i0=0;
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);
$("mot").onclick=()=>{off=document.body.classList.toggle("off");$("mot").textContent="Animasi: "+(off?"Mati":"Hidup");$("mot").setAttribute("aria-pressed",off);if(off)cx.clearRect(0,0,cv.width,cv.height)};
function openDoor(){
 if(ready||$("door").classList.contains("open"))return;
 $("door").classList.add("open");
 setTimeout(()=>{ready=true;show(0,1)},off?0:1100);
 setTimeout(()=>$("door").classList.add("gone"),off?50:2100);
 setTimeout(()=>$("door").remove(),off?200:3300);
}
$("go").onclick=openDoor;
$("door").addEventListener("touchend",openDoor,{passive:true});
$("door").addEventListener("pointerup",openDoor);
function fit(sl){
 const w=sl.firstElementChild,cs=getComputedStyle(sl);
 const aw=sl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const av=sl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 if(aw<=0||av<=0)return;
 let lo=.9,hi=1.7;
 for(let k=0;k<7;k++){const z=(lo+hi)/2;w.style.zoom=z;w.style.maxWidth=(Math.min(aw,1280)/z)+"px";
  if(w.getBoundingClientRect().height<=av)lo=z;else hi=z}
 w.style.zoom=lo;w.style.maxWidth=(Math.min(aw,1280)/lo)+"px";
}
function fitAll(){document.querySelectorAll(".slide:not(#s0)").forEach(fit)}
fitAll();addEventListener("resize",fitAll);if(document.fonts)document.fonts.ready.then(fitAll);
mark();
const cv=$("cv"),cx=cv.getContext("2d"),P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let k=0;k<45;k++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.6,s:Math.random()*.0004+.0001,a:Math.random()*6});
function fr(t){requestAnimationFrame(fr);if(off||document.hidden)return;
 cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle="#e8c26a";
 P.forEach(p=>{p.y-=p.s*16;p.x+=Math.sin(t/2000+p.a)*.0003;if(p.y<0)p.y=1;cx.globalAlpha=.2+.4*Math.pow(Math.sin(t/900+p.a),2);cx.beginPath();cx.arc(p.x*cv.width,p.y*cv.height,p.r,0,7);cx.fill()})}
requestAnimationFrame(fr);
const TC=".card,.flipc,.st";
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(TC);if(!c||off)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");c.style.setProperty("--ry",(x-.5)*10+"deg");c.style.setProperty("--rx",(.5-y)*10+"deg")});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(TC);if(c){c.style.removeProperty("--rx");c.style.removeProperty("--ry")}});
